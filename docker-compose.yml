

services:
  api:
    build: .
    command: uvicorn api.mapi:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  
  frontend:
    build: .
    command: streamlit run frontend/Main_Page.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_URL: "http://api:8000"
    depends_on:
      - api